global:
  sendAnonymousUsage: false
providers:
  swarm:
    exposedByDefault: false
    watch: true
  docker:
    exposedByDefault: false
    watch: true
    network: dokploy-network
  file:
    directory: /etc/dokploy/traefik/dynamic
    watch: true
entryPoints:
  web:
    address: :80
    # Only Cloudflare may set the client address. Unset, every visitor looks
    # like a Cloudflare IP and rate limits and audit logs record the wrong
    # person while appearing to work. Set to "all", any client can forge
    # X-Forwarded-For and impersonate another address.
    # Source: https://www.cloudflare.com/ips/ — re-sync when they publish
    # new ranges, or forwarded headers from the new edges stop being trusted.
    forwardedHeaders:
      trustedIPs: &cloudflare
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
  websecure:
    address: :443
    http3:
      advertisedPort: 443
    forwardedHeaders:
      trustedIPs: *cloudflare
    http:
      tls:
        certResolver: letsencrypt
api:
  insecure: true
certificatesResolvers:
  # Original HTTP-01 resolver. Kept deliberately: it still works for any host
  # that is NOT proxied through Cloudflare, and every existing certificate was
  # issued by it. Removing it would force a re-issue of everything at once.
  letsencrypt:
    acme:
      email: rajesh@mitosia.com
      storage: /etc/dokploy/traefik/dynamic/acme.json
      httpChallenge:
        entryPoint: web
  # DNS-01. Proves domain ownership by writing a TXT record instead of
  # answering an HTTP request, so it is unaffected by Cloudflare proxying,
  # redirects, WAF rules, or the origin firewall — all of which can silently
  # break HTTP-01 once traffic goes through a CDN. It is also the only
  # challenge type that can issue a wildcard.
  #
  # Separate storage file: two resolvers must not share one acme.json.
  letsencrypt-dns:
    acme:
      email: rajesh@mitosia.com
      storage: /etc/dokploy/traefik/dynamic/acme-dns.json
      dnsChallenge:
        provider: cloudflare
        # Check propagation against public resolvers rather than whatever the
        # host uses. Traefik's docs warn that for wildcard+root combinations a
        # cached TTL can outlast the challenge timeout and fail the issuance.
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
