name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the e2e job be run against a branch on demand — before a risky
  # merge, or to reproduce a failure that only main saw.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time placeholders — lib/env.ts validates at import; no live services are contacted during build.
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere
  BETTER_AUTH_URL: http://localhost:3000
  # Disposable database for the RLS isolation suite (wiped every run).
  TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  # Placeholders for the checks job; the e2e job runs a real MinIO on this
  # endpoint with these exact credentials (MinIO needs a secret ≥8 chars).
  STORAGE_ENDPOINT: http://localhost:55490
  STORAGE_REGION: auto
  STORAGE_ACCESS_KEY_ID: ci-storage-user
  STORAGE_SECRET_ACCESS_KEY: ci-storage-secret
  STORAGE_BUCKET: ci-media
  STORAGE_FORCE_PATH_STYLE: "true"

jobs:
  checks:
    runs-on: ubuntu-latest
    # Measured at ~1 minute; this is a hang backstop, not a budget.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Cross-tenant isolation tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Runs on main and on demand, NOT on every pull request.
  #
  # A PR gates on `checks` (~2 min: lint, typecheck, cross-tenant tests,
  # build) and this runs after the merge, so a break is known within ~7
  # minutes while the change is still fresh — and main deploys to staging,
  # not production, so the blast radius is a staging environment.
  #
  # Why the whole job rather than a fast subset: no single spec dominates
  # (the slowest is ~15s, the suite ~50s locally), while roughly 40% of the
  # job is fixed setup — containers, node, pnpm, Playwright, ffmpeg, MinIO,
  # migrations. Splitting would pay that setup twice to save nothing.
  #
  # The saving is per *push*, not per PR: this used to re-run on every push
  # to every branch, so a PR that was rebased three times cost three full
  # runs. Now it costs one, at merge.
  #
  # Revisit when main being green matters to someone other than the person
  # who broke it — that is the point where pre-merge enforcement earns its
  # wait again.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Measured at 5-7 minutes. A run with no ceiling sat on a stalled
    # Playwright download for 3.5 hours before anyone noticed, holding up a
    # merge the whole time; GitHub's own default is 6 hours, which is not a
    # ceiling in any useful sense.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      # The app must NOT connect as the ci superuser: superusers silently
      # bypass RLS, which is the org filter in every tenant query — with it
      # off, e2e retries can see and attach to a previous attempt's data
      # (PR #16). ci_app mirrors the mitosia_app/production shape.
      DATABASE_URL: postgres://ci_app:ci_app@localhost:5432/ci
      MIGRATE_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere
      # Must match the e2e dev server port or Better Auth rejects auth as cross-origin
      BETTER_AUTH_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 159s of a ~430s job, downloaded fresh every run, and the step that
      # stalled for 3.5 hours. Keyed on the Playwright version so a bump
      # invalidates it — a browser that disagrees with the test runner fails
      # in ways that look like flakes.
      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # One unconditional step, not a cache-hit/miss pair. `playwright install`
      # is a 0.8s no-op when the binary is already present, so the cache still
      # saves the ~150s download — while the apt half runs exactly as it did
      # before the cache existed.
      #
      # The split version put `install-deps` on the cache-hit path and it hung
      # for the full 10-minute timeout on its first run, apt stalled partway
      # through. apt was always part of `--with-deps` and never a problem;
      # moving it onto its own conditional branch is what made it one.
      - name: Install Playwright browser and system dependencies
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      # The ingest e2e generates its fixture and runs the real pipeline, so
      # CI's ffmpeg has to be the one the image ships (Alpine 3.24 → 8.1.x).
      # Ubuntu's apt ffmpeg is 6.1.1, two majors behind: ffmpeg-8-only
      # options are a HARD failure there (an unknown option aborts ffmpeg, so
      # every ingest breaks — PR #23), and the ffmpeg 8 behaviour lib/media/
      # is written around cannot be exercised at all. Pinned to an immutable
      # BtbN release asset; bump alongside the Dockerfile's Alpine pin.
      #
      # The asset coordinates live in scripts/ffmpeg-pin.mjs, not here: the
      # Trigger.dev deploy image installs the same build (Debian's apt ffmpeg
      # is 5.1.x), and a checksum copied into two files is a checksum that
      # eventually disagrees with itself.
      - name: Install ffmpeg
        run: |
          eval "$(node -e 'import("./scripts/ffmpeg-pin.mjs").then((pin) => {
            process.stdout.write(
              `FFMPEG_URL=${pin.FFMPEG_URL}\nFFMPEG_BUILD=${pin.FFMPEG_BUILD}\nFFMPEG_SHA256=${pin.FFMPEG_SHA256}\n`
            );
          })')"
          curl -fsSL -o /tmp/ffmpeg.tar.xz "${FFMPEG_URL}"
          echo "${FFMPEG_SHA256}  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/ffmpeg.tar.xz -C /usr/local/bin --strip-components=2 \
            "${FFMPEG_BUILD}/bin/ffmpeg" "${FFMPEG_BUILD}/bin/ffprobe"

      # Guards the pin above against the deployed image's ffmpeg: same script
      # runs in the Dockerfile, so whichever side drifts fails.
      - name: Verify ffmpeg matches the deployed image
        run: pnpm check:ffmpeg

      # Service containers cannot set a command, and MinIO's image needs
      # one — so start it directly on the runner's Docker.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 55490:9000 \
            -e MINIO_ROOT_USER=ci-storage-user -e MINIO_ROOT_PASSWORD=ci-storage-secret \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:55490/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c \
            "mc alias set ci http://localhost:55490 ci-storage-user ci-storage-secret && mc mb --ignore-existing ci/ci-media"

      - name: Apply migrations
        run: pnpm db:migrate

      # Non-superuser app role, mirroring docker/dev-init/01-app-role.sql:
      # the app's connection must be subject to RLS or the e2e suite runs
      # against a tenancy model that doesn't exist in production.
      - name: Create app role
        run: |
          psql "$MIGRATE_DATABASE_URL" <<'SQL'
          CREATE ROLE ci_app LOGIN PASSWORD 'ci_app';
          GRANT CONNECT ON DATABASE ci TO ci_app;
          GRANT USAGE ON SCHEMA public TO ci_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ci_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ci_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE ci IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ci_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE ci IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO ci_app;
          SQL

      - name: Run end-to-end tests
        run: pnpm e2e

      # Production parity: `next dev` cannot surface hydration mismatches or
      # standalone-output problems, and a mismatch shipped behind exactly
      # that gap (PR #19). Reuses this job's database, MinIO and migrations.
      # tsconfig.json includes .next/dev/types/**, so `next build` type-checks
      # whatever the dev server last wrote there — and the e2e run above ends
      # by killing that server, which can leave validator.ts half-written and
      # fail this build with syntax errors in generated code. A deploy builds
      # from a clean tree; so does this.
      - name: Build standalone server
        run: rm -rf .next/dev && pnpm build

      - name: Run production-build end-to-end tests
        run: pnpm e2e:prod

      # Traces (recorded on first retry) are the only way to debug a
      # headless-only playback failure.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
