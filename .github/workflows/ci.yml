name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time placeholders — lib/env.ts validates at import; no live services are contacted during build.
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere
  BETTER_AUTH_URL: http://localhost:3000
  # Disposable database for the RLS isolation suite (wiped every run).
  TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  # Placeholders for the checks job; the e2e job runs a real MinIO on this
  # endpoint with these exact credentials (MinIO needs a secret ≥8 chars).
  STORAGE_ENDPOINT: http://localhost:55490
  STORAGE_REGION: auto
  STORAGE_ACCESS_KEY_ID: ci-storage-user
  STORAGE_SECRET_ACCESS_KEY: ci-storage-secret
  STORAGE_BUCKET: ci
  STORAGE_FORCE_PATH_STYLE: "true"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Cross-tenant isolation tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      MIGRATE_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere
      # Must match the e2e dev server port or Better Auth rejects auth as cross-origin
      BETTER_AUTH_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # The ingest e2e generates its fixture and runs the real pipeline.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Service containers cannot set a command, and MinIO's image needs
      # one — so start it directly on the runner's Docker.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 55490:9000 \
            -e MINIO_ROOT_USER=ci-storage-user -e MINIO_ROOT_PASSWORD=ci-storage-secret \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:55490/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c \
            "mc alias set ci http://localhost:55490 ci-storage-user ci-storage-secret && mc mb --ignore-existing ci/ci"

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Run end-to-end tests
        run: pnpm e2e
