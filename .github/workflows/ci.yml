name: Local CI provenance

on:
  pull_request:

permissions:
  contents: read
  statuses: read

concurrency:
  group: local-ci-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # All validation runs on the developer machine before push. This small
  # GitHub-owned context keeps branch protection independent of a local hook:
  # it accepts only a successful status for this exact SHA, authored by the
  # PR author and linked back to the immutable commit.
  # Keep the established `checks` context during the transition: open PRs
  # that already passed the former full checks job stay mergeable, while new
  # PRs get this proof-only implementation under the same Actions-owned name.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify exact-commit local attestation
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          expected_url="https://github.com/${REPOSITORY}/commit/${HEAD_SHA}"
          status=$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/statuses" | jq -r \
            --arg author "$PR_AUTHOR" --arg target "$expected_url" \
            '[.[] | select(.context == "local-ci" and .creator.login == $author and .target_url == $target)][0].state // empty')

          if [ "$status" != "success" ]; then
            echo "::error::No successful local-ci attestation from ${PR_AUTHOR} exists for exact commit ${HEAD_SHA}."
            echo "Run pnpm push:verified, then re-run this job."
            exit 1
          fi

          echo "Exact commit ${HEAD_SHA} passed the repository-owned local gate."
