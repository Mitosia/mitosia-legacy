name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time placeholders — lib/env.ts validates at import; no live services are contacted during build.
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere
  BETTER_AUTH_URL: http://localhost:3000
  # Disposable database for the RLS isolation suite (wiped every run).
  TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  # Placeholders for the checks job; the e2e job runs a real MinIO on this
  # endpoint with these exact credentials (MinIO needs a secret ≥8 chars).
  STORAGE_ENDPOINT: http://localhost:55490
  STORAGE_REGION: auto
  STORAGE_ACCESS_KEY_ID: ci-storage-user
  STORAGE_SECRET_ACCESS_KEY: ci-storage-secret
  STORAGE_BUCKET: ci-media
  STORAGE_FORCE_PATH_STYLE: "true"

jobs:
  # Classifies the diff so docs-only changes skip validation: half of the
  # merges to main touch nothing but docs/ and *.md (measured 19 of 39 on
  # 2026-08-24), and each was paying the full ~4.5-minute e2e run for it.
  # Required checks skipped via `if:` satisfy branch protection, so
  # docs-only PRs only pay for this small classifier.
  #
  # Fail-open by construction: any uncertainty — force-push, zero SHA,
  # git error, or this job failing outright — must RUN e2e, never skip it.
  # That is why the diff commands swallow errors into an empty list (empty
  # classifies as code) and why the e2e `if:` tests `!= 'false'` rather
  # than `== 'true'`: if this job dies, its output is empty and e2e still
  # runs. Skipping e2e on a code change is the failure mode that lets a
  # regression merge; ~15 s of classifier on every run is the premium.
  #
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the classifier diffs against the PR base (or the
          # pre-push head), which a depth-1 clone does not contain.
          fetch-depth: 0

      - name: Classify the diff
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # HEAD is the PR merge commit; three-dot against the base is
          # exactly the PR's file set.
          files=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "Could not classify the diff — running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          if echo "$files" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only diff — validation jobs will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    needs: changes
    # Fail open if classification is unavailable; only an explicit docs-only
    # result skips validation.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Measured at ~3 minutes; this is a hang backstop, not a budget.
    timeout-minutes: 15
    env:
      # Owner connection for migrations and role creation. The prod-parity
      # server below must NOT connect with it — see its step env.
      MIGRATE_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    services:
      postgres:
        # postgres:18 + pgvector, matching docker-compose.yml (S5 semantic search)
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm check

      - name: Cross-tenant isolation tests
        run: pnpm test

      # Turbopack writes a filesystem build cache to .next/cache by default
      # (Next 16.3+), but it only helps if something restores it — before
      # this cache existed, every build here ran cold and wrote a cache
      # nothing ever read. The restore-key falls back to the newest cache
      # for this lockfile; Turbopack invalidates its contents by content, so
      # a stale hit is a warm start, never a wrong build.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '!node_modules/**', '!.next/**') }}
          # The bare fallback matters: with only the lockfile-prefixed one, a
          # dependency bump cold-started the build (58s vs 13s warm in PR
          # #62's runs). Turbopack invalidates cache contents by its own
          # hashing, so a stale restore is a warm start, never a wrong build.
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        # Next 16.3 runs the project-local tsc CLI during `next build`, so a
        # separate `next typegen && tsc --noEmit` immediately beforehand was
        # the same full-project type check twice.
        run: pnpm build

      # ——— Production-parity e2e (playwright.prod.config.ts) ———
      # Runs here rather than in the e2e job: it needs a `pnpm build` anyway
      # (which this job already does), and the e2e job is the pipeline's
      # critical path — this job finishes minutes earlier. `next dev` cannot
      # surface hydration mismatches or standalone-output problems, and a
      # mismatch shipped behind exactly that gap (PR #19). The hydration
      # suite never touches uploads, so no MinIO or ffmpeg here — just
      # Postgres, migrations, and the RLS-subject app role.

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # One unconditional step, no `--with-deps` — see the e2e job for the
      # apt-hang history and why the runner image already has the libraries.
      - name: Install Playwright browser
        timeout-minutes: 10
        run: pnpm exec playwright install chromium

      # The RLS suite above wipes and re-migrates this database in its
      # beforeAll, so this is normally a no-op — it exists so the prod suite
      # does not silently depend on the unit suite having run first.
      - name: Apply migrations
        run: pnpm db:migrate

      # Non-superuser app role, mirroring docker/dev-init/01-app-role.sql —
      # the server under test must be subject to RLS (PR #16's lesson, same
      # as the e2e job). Runs after the RLS suite's schema wipe, which drops
      # default-privilege entries along with the schema.
      - name: Create app role
        run: |
          psql "$MIGRATE_DATABASE_URL" <<'SQL'
          CREATE ROLE ci_app LOGIN PASSWORD 'ci_app';
          GRANT CONNECT ON DATABASE ci TO ci_app;
          GRANT USAGE ON SCHEMA public TO ci_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ci_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ci_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE ci IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ci_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE ci IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO ci_app;
          SQL

      - name: Run production-build end-to-end tests
        env:
          DATABASE_URL: postgres://ci_app:ci_app@localhost:5432/ci
        run: pnpm e2e:prod

  e2e-shards:
    name: e2e / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: changes
    # `!= 'false'`, not `== 'true'`: if the classifier fails, its output is
    # empty and this must still run (fail-open — see the changes job). The
    # `!cancelled()` is what lets this job run at all after a failed need;
    # without it a dead classifier would silently skip e2e, and a skipped
    # required check MERGES.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Balanced from real CI durations on 2026-08-28. Separate runners
          # provide four CPUs without oversubscribing a 2-vCPU machine (three
          # Playwright workers on one runner already proved flaky in PR #62).
          - shard: pipeline
            specs: >-
              e2e/ingest-reaper.spec.ts
              e2e/source-ingest.spec.ts
              e2e/upload-reaper.spec.ts
              e2e/upload-resume.spec.ts
              e2e/offline-resilience.spec.ts
          - shard: workspace
            specs: >-
              e2e/app-shell.spec.ts
              e2e/source-intelligence.spec.ts
              e2e/transcript-viewer.spec.ts
              e2e/upload-adopt.spec.ts
    # Measured at ~4 minutes (2 parallel workers). A run with no ceiling sat
    # on a stalled Playwright download for 3.5 hours before anyone noticed,
    # holding up a merge the whole time; GitHub's own default is 6 hours,
    # which is not a ceiling in any useful sense.
    timeout-minutes: 20
    services:
      postgres:
        # postgres:18 + pgvector, matching docker-compose.yml (S5 semantic search)
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      # The app must NOT connect as the ci superuser: superusers silently
      # bypass RLS, which is the org filter in every tenant query — with it
      # off, e2e retries can see and attach to a previous attempt's data
      # (PR #16). ci_app mirrors the mitosia_app/production shape.
      DATABASE_URL: postgres://ci_app:ci_app@localhost:5432/ci
      MIGRATE_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere
      # Must match the e2e dev server port or Better Auth rejects auth as cross-origin
      BETTER_AUTH_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 159s of a ~430s job, downloaded fresh every run, and the step that
      # stalled for 3.5 hours. Keyed on the Playwright version so a bump
      # invalidates it — a browser that disagrees with the test runner fails
      # in ways that look like flakes.
      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # One unconditional step, not a cache-hit/miss pair. `playwright install`
      # is a 0.8s no-op when the binary is already present, so the cache still
      # saves the ~150s download.
      #
      # No `--with-deps`: the apt half ran on every job (~15s) and is the
      # part that once hung — first for 3.5 hours with no job timeout, later
      # for a full 10-minute step timeout when a split install put it on the
      # cache-hit path. ubuntu-latest ships Chrome, so every shared library
      # headless chromium needs is already on the image. If a future runner
      # image drops one, the failure is loud (the browser fails to launch on
      # the first test) — reinstate --with-deps then.
      - name: Install Playwright browser
        timeout-minutes: 10
        run: pnpm exec playwright install chromium

      # The specs' beforeAll blocks generate these with ffmpeg — two are 10s
      # 720p encodes at 20 Mbps CBR, slow on a 2-vCPU runner. The encode
      # parameters live in the spec files themselves, so keying on them
      # over-invalidates (any spec edit regenerates) but can never serve a
      # stale fixture.
      - name: Cache e2e media fixtures
        uses: actions/cache@v6
        with:
          path: e2e/.fixtures
          # Per-shard keys prevent two cold jobs racing to save different
          # partial fixture directories under one immutable cache key.
          key: e2e-fixtures-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('e2e/**/*.spec.ts') }}

      # The ingest e2e generates its fixture and runs the real pipeline, so
      # CI's ffmpeg has to be the one the image ships (Alpine 3.24 → 8.1.x).
      # Ubuntu's apt ffmpeg is 6.1.1, two majors behind: ffmpeg-8-only
      # options are a HARD failure there (an unknown option aborts ffmpeg, so
      # every ingest breaks — PR #23), and the ffmpeg 8 behaviour lib/media/
      # is written around cannot be exercised at all. The checksummed static
      # build downloads from this repo's own ffmpeg-static/* release — a
      # mirror, because BtbN prunes its dated releases and 404'd the previous
      # pin (2026-08-24). Bump alongside the Dockerfile's Alpine pin.
      #
      # The asset coordinates live in scripts/ffmpeg-pin.mjs, not here: the
      # Trigger.dev deploy image installs the same build (Debian's apt ffmpeg
      # is 5.1.x), and a checksum copied into two files is a checksum that
      # eventually disagrees with itself.
      - name: Install ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$(node -e 'import("./scripts/ffmpeg-pin.mjs").then((pin) => {
            process.stdout.write(
              `FFMPEG_MIRROR_REPO=${pin.FFMPEG_MIRROR_REPO}\nFFMPEG_MIRROR_TAG=${pin.FFMPEG_MIRROR_TAG}\nFFMPEG_ASSET=${pin.FFMPEG_ASSET}\nFFMPEG_BUILD=${pin.FFMPEG_BUILD}\nFFMPEG_SHA256=${pin.FFMPEG_SHA256}\n`
            );
          })')"
          gh release download "${FFMPEG_MIRROR_TAG}" --repo "${FFMPEG_MIRROR_REPO}" \
            --pattern "${FFMPEG_ASSET}" --output /tmp/ffmpeg.tar.xz
          echo "${FFMPEG_SHA256}  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/ffmpeg.tar.xz -C /usr/local/bin --strip-components=2 \
            "${FFMPEG_BUILD}/bin/ffmpeg" "${FFMPEG_BUILD}/bin/ffprobe"

      # Guards the pin above against the deployed image's ffmpeg: same script
      # runs in the Dockerfile, so whichever side drifts fails.
      - name: Verify ffmpeg matches the deployed image
        run: pnpm check:ffmpeg

      # Service containers cannot set a command, and MinIO's image needs
      # one — so start it directly on the runner's Docker.
      - name: Start MinIO
        run: |
          # 55490 was once already bound on a hosted runner (PR #101: one
          # shard failed at docker run with "address already in use", green
          # on rerun) — clear any stale container and retry the bind.
          docker rm -f minio 2>/dev/null || true
          for attempt in 1 2 3; do
            docker run -d --name minio -p 55490:9000 \
              -e MINIO_ROOT_USER=ci-storage-user -e MINIO_ROOT_PASSWORD=ci-storage-secret \
              minio/minio server /data && break
            echo "minio start attempt $attempt failed; retrying"
            docker rm -f minio 2>/dev/null || true
            sleep 5
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:55490/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c \
            "mc alias set ci http://localhost:55490 ci-storage-user ci-storage-secret && mc mb --ignore-existing ci/ci-media"

      - name: Apply migrations
        run: pnpm db:migrate

      # Non-superuser app role, mirroring docker/dev-init/01-app-role.sql:
      # the app's connection must be subject to RLS or the e2e suite runs
      # against a tenancy model that doesn't exist in production.
      - name: Create app role
        run: |
          psql "$MIGRATE_DATABASE_URL" <<'SQL'
          CREATE ROLE ci_app LOGIN PASSWORD 'ci_app';
          GRANT CONNECT ON DATABASE ci TO ci_app;
          GRANT USAGE ON SCHEMA public TO ci_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ci_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ci_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE ci IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ci_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE ci IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO ci_app;
          SQL

      - name: Run end-to-end tests
        # Invoke Playwright directly: `pnpm e2e -- files...` inserts a literal
        # `--` before the file filters, causing Playwright to ignore them and
        # run the full suite in both shards.
        run: pnpm exec playwright test ${{ matrix.specs }}

      # Traces (recorded on first retry) are the only way to debug a
      # headless-only playback failure.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Branch protection requires one stable `e2e` context. The expensive work
  # happens above on two runners; this tiny fan-in keeps that context stable
  # and also succeeds for an intentional docs-only skip.
  e2e:
    runs-on: ubuntu-latest
    needs: [changes, e2e-shards]
    if: ${{ always() }}
    timeout-minutes: 2
    steps:
      - name: Verify e2e shards
        env:
          CODE_CHANGE: ${{ needs.changes.outputs.code }}
          SHARDS_RESULT: ${{ needs.e2e-shards.result }}
        run: |
          if [ "$CODE_CHANGE" = "false" ]; then
            echo "Docs-only change — e2e intentionally skipped."
            exit 0
          fi
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::One or more e2e shards did not pass (result: $SHARDS_RESULT)."
            exit 1
          fi
          echo "All e2e shards passed."
