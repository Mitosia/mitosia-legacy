# Golden evals for AI capabilities — manual trigger, not per-PR: eval runs
# spend real model tokens and grade quality, not correctness. Run before
# promoting prompt changes; the deterministic scorers gate, the judge
# grades. Needs the OPENROUTER_API_KEY repo secret.
name: evals
on:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
