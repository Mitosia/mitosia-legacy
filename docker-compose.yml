name: mitosia-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitosia
      POSTGRES_PASSWORD: mitosia
      POSTGRES_DB: mitosia
    ports:
      # 55433 on the host: native Postgres owns 5432, and a Podman VM squats
      # on the IPv4 side of 5433 — this port avoids both
      - "55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitosia -d mitosia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
