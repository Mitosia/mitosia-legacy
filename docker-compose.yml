name: mitosia-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitosia
      POSTGRES_PASSWORD: mitosia
      POSTGRES_DB: mitosia
    ports:
      # 55433 on the host: native Postgres owns 5432, and a Podman VM squats
      # on the IPv4 side of 5433 — this port avoids both
      - "55433:5432"
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql
      # (PGDATA moved to a versioned subdirectory)
      - postgres-data:/var/lib/postgresql
      # Creates the non-superuser app role on first boot (RLS enforcement)
      - ./docker/dev-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitosia -d mitosia"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mitosia
      MINIO_ROOT_PASSWORD: mitosia-dev
      # Browser uploads go straight to presigned URLs; Uppy must be able to
      # read the ETag response header cross-origin to complete multipart.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      # Same reasoning as Postgres: high ports, clear of other local stacks
      - "55490:9000"
      - "55491:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the media bucket on first boot, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 mitosia mitosia-dev &&
        mc mb --ignore-existing local/mitosia-media

volumes:
  postgres-data:
  minio-data:
